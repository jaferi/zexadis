[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/protocol",
    "crates/server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

authors = ["Hesam (SAM) Jaferi <hesam.jaferi@gmail.com>"]
license = "Apache-2.0"
description = "A lightweight, binary-first hot-state store for latency-sensitive infrastructure."
readme = "README.md"
repository = "https://github.com/jaferi/zexadis"
homepage = "https://github.com/jaferi/zexadis"
documentation = "https://github.com/jaferi/zexadis"

keywords = [
    "cache",
    "storage",
    "binary",
    "in-memory",
    "infrastructure",
]

categories = [
    "database-implementations",
    "network-programming",
]

[workspace.dependencies]
bytes = "1"
dashmap = "6"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"